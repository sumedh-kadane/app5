apiVersion: apps/v1
kind: Deployment
metadata:
  name: app5
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: app5
  template:
    metadata:
      labels:
        app: app5
    spec:
      containers:
        - name: container1
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          ports:
            - containerPort: 80
